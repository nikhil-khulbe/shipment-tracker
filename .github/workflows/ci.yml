name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated types are up to date
        run: |
          npm run codegen
          git diff --exit-code apps/api/schema.graphql apps/mobile/src/generated
      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api
      - name: Typecheck app
        run: npx tsc --noEmit -p apps/mobile
      - name: API tests
        run: npm test -w api
      - name: App tests
        run: npm test -w mobile
